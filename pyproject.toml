[project]
name = "geodemand-ai"
version = "2.1.0"
description = "Geospatial Decision Intelligence Platform for Mobile Vendors"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "h3>=4.0.0",
    "requests>=2.31.0",
    "holidays>=0.40",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
