name: GeoDemand AI — CI/CD Pipeline

on:
  push:
    branches: [ main, master, "dev/**", "feature/**", "fix/**", "chore/**", "docs/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Test & Validate Model Pipeline
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "src:src/data:src/features:src/api:."

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Setup environment configuration
      run: cp .env.example .env

    - name: Run Test Suite
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Verify Model Inference & SHAP
      run: |
        python -c "
        from api.recommender import DemandModel
        model = DemandModel.get()
        print('Demand Model loaded successfully:', model.meta)
        "
