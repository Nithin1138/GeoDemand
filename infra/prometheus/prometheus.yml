global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: [] # Configure alertmanager host if deployed

scrape_configs:
  # 1. GeoDemand FastAPI Service Telemetry & Metrics
  - job_name: "geodemand-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "fastapi-core"

  # 2. Redis Cache Exporter
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
        labels:
          service: "redis-cache"

  # 3. PostgreSQL / PostGIS Spatial Database Exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["db:5432"]
        labels:
          service: "postgis-db"

  # 4. RabbitMQ Stream Ingestion & DLQ Metrics
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels:
          service: "rabbitmq-broker"
