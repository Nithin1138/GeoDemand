# ==============================================================================
# GeoDemand AI — Production NGINX Reverse Proxy Configuration
# Purpose: SSL Termination, Webhook Routing, Rate Limiting & Header Preservation
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format including upstream latency and tracing headers
    log_format main_trace '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time" '
                          'cid="$http_x_correlation_id"';

    access_log /var/log/nginx/access.log main_trace;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones
    # General API: 30 requests/sec per IP with burst of 20
    limit_req_zone $binary_remote_addr zone=general_api_zone:10m rate=30r/s;
    # Webhooks: 100 requests/sec per IP with burst of 50 (to handle payment notification bursts)
    limit_req_zone $binary_remote_addr zone=webhooks_zone:10m rate=100r/s;

    # Upstream definition for GeoDemand FastAPI Backend
    upstream geodemand_backend {
        server geodemand-api:8000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Server — Redirects all traffic to HTTPS (except Let's Encrypt challenge)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge location for automated Let's Encrypt / Certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Healthcheck endpoint for load balancers (AWS ALB, GCP, K8s ingress)
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Force SSL redirection
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS Server — SSL Termination & Secured Webhook Gateway
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # TLS Protocols & Cipher Suites (Mozilla Modern Guidelines)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Healthcheck endpoint
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ----------------------------------------------------------------------
        # High-Priority Payment & Messaging Webhooks Gateway
        # Razorpay, Paytm, PhonePe, WhatsApp, and Telegram Webhook Callbacks
        # ----------------------------------------------------------------------
        location /v1/webhooks/ {
            limit_req zone=webhooks_zone burst=50 nodelay;

            proxy_pass http://geodemand_backend;
            proxy_http_version 1.1;

            # Crucial: Preserve full request headers and payload body for HMAC-SHA256 verification
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            client_max_body_size 10M;

            # Header preservation for HMAC signature validation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Webhook provider-specific signature headers
            proxy_set_header X-Razorpay-Signature $http_x_razorpay_signature;
            proxy_set_header X-Paytm-Signature $http_x_paytm_signature;
            proxy_set_header X-PhonePe-Signature $http_x_phonepe_signature;
            proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;

            # Webhook response SLA timeouts (fail fast to trigger provider retries if stalled)
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # ----------------------------------------------------------------------
        # General Application Endpoints & Dashboard
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=general_api_zone burst=20 nodelay;

            proxy_pass http://geodemand_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection "";

            client_max_body_size 25M;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
