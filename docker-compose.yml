version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geodemand-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geodemand}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geodemand_secret_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-geodemand}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: geodemand-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm:
    image: osrm/osrm-backend:latest
    container_name: geodemand-osrm
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    command: >
      sh -c "if [ -f /data/andhra-pradesh-latest.osrm ]; then
               osrm-routed --algorithm mld /data/andhra-pradesh-latest.osrm;
             else
               echo 'OSRM graph not found. Run scripts/setup_osrm_andhra.sh to download. Falling back to idle.';
               sleep infinity;
             fi"

  geodemand-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geodemand-ai
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-geodemand_secret_pw}@db:5432/${POSTGRES_DB:-geodemand}
      - ENABLE_RABBITMQ=true
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      - OSRM_URL=http://osrm:5000
      - LIVE_MODE=true
      - ALLOW_SYNTHETIC_FALLBACK=true
      - SHOW_FALLBACK_WARNINGS=true
      - WEATHER_PROVIDER=open_meteo
      - TRAFFIC_PROVIDER=auto
      - COMPETITION_PROVIDER=auto
      - FUEL_PRICE_PROVIDER=manual
      - FUEL_PRICE_INR_PER_LITRE=95.0
      - SEARCH_RADIUS_KM=2.0
      - TOP_N=5
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/system/ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: geodemand-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - geodemand-api

volumes:
  postgis_data:
  rabbitmq_data:
